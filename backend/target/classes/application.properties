# Server Port
server.port=8080

# Database Configuration (Supabase PostgreSQL)
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:5432/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER:postgres.your-project-id}
spring.datasource.password=${SUPABASE_DB_PASSWORD:your-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Custom JWT Configuration
jwt.secret=chillcodeSuperSecretJWTKeyForCollegeAssessmentsPlatformMustBeAtLeast256BitsLong
# Expiration: 1 day (86400000 ms)
jwt.expiration=86400000
# Refresh Expiration: 7 days (604800000 ms)
jwt.refresh-expiration=604800000

# File Upload Max sizes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
