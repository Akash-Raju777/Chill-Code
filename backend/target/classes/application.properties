# Server Port
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3606/chill_code?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Custom JWT Configuration
jwt.secret=chillcodeSuperSecretJWTKeyForCollegeAssessmentsPlatformMustBeAtLeast256BitsLong
# Expiration: 1 day (86400000 ms)
jwt.expiration=86400000
# Refresh Expiration: 7 days (604800000 ms)
jwt.refresh-expiration=604800000

# File Upload Max sizes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
