# Server Port
server.port=${PORT:8080}

# Database Configuration (Supabase PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.kuvllswyxrtjjbougrgy}
spring.datasource.password=${DB_PASSWORD:AkashAkASh@777}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Hikari Connection Pool Settings for Supabase
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Custom JWT Configuration
jwt.secret=${JWT_SECRET:super_secret_jwt_key_for_chill_code_assessment_platform_dev_mode_32bytes}
# Expiration: 1 day (86400000 ms)
jwt.expiration=86400000
# Refresh Expiration: 7 days (604800000 ms)
jwt.refresh-expiration=604800000

# File Upload Max sizes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Local Judge0 CE API Endpoint
judge0.api.url=${JUDGE0_API_URL:http://localhost:2358}

# Grok/xAI API configuration
xai.api.key=${GROQ_API_KEY:gsk_default_key_placeholder}

# Jackson Serialization Configuration (prevents ByteBuddyInterceptor serialization errors on lazy proxies)
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.time-zone=Asia/Kolkata


