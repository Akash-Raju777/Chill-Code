# Server Port
server.port=8080

# Database Configuration (Supabase PostgreSQL)
spring.datasource.url=jdbc:postgresql://db.kuvllswyxrtjjbougrgy.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=Akash@1001777
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings for Supabase
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Custom JWT Configuration
jwt.secret=chillcodeSuperSecretJWTKeyForCollegeAssessmentsPlatformMustBeAtLeast256BitsLong
# Expiration: 1 day (86400000 ms)
jwt.expiration=86400000
# Refresh Expiration: 7 days (604800000 ms)
jwt.refresh-expiration=604800000

# File Upload Max sizes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Local Judge0 CE API Endpoint
