version: '2.1'

services:
  server:
    image: judge0/judge0:1.13.0
    volumes:
      - ./judge0.conf:/etc/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    depends_on:
      - db
      - redis

  worker:
    image: judge0/judge0:1.13.0
    volumes:
      - ./judge0.conf:/etc/judge0.conf:ro
    privileged: true
    restart: always
    depends_on:
      - db
      - redis

  db:
    image: postgres:13.0
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:6.0
    command: redis-server --save "" --appendonly no
    restart: always

volumes:
  postgres-data:
