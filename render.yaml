services:
  # 1. Spring Boot Backend (Docker)
  - type: web
    name: chillcode-backend
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_TOOL_OPTIONS
        value: -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
      - key: DB_URL
        value: jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&tcpKeepAlive=true
      - key: DB_USERNAME
        value: postgres.kuvllswyxrtjjbougrgy
      - key: DB_PASSWORD
        value: AkashAkASh@777

  # 2. Next.js Frontend (Node)
  - type: web
    name: chillcode-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
